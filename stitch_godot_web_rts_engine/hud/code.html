<!-- Dynamic Audio & Interaction Feedback Script -->
<script>
    function triggerTactileFeedback(label) {
      const toast = document.getElementById('battle-hud-toast');
      if (toast) {
        toast.textContent = label;
        toast.classList.remove('opacity-0', 'translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');
        clearTimeout(window.__toastTimeout);
        window.__toastTimeout = setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'translate-y-2');
        }, 1600);
      }
    }

    function toggleUnitStance(btn, stanceName) {
      document.querySelectorAll('.stance-btn').forEach(b => {
        b.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-md');
        b.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
      });
      btn.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
      btn.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-md');
      triggerTactileFeedback('Стойка: ' + stanceName);
    }

    function triggerVolley() {
      const volleyBtn = document.getElementById('btn-volley');
      const volleyCd = document.getElementById('volley-cooldown');
      if (volleyCd && volleyCd.classList.contains('hidden')) {
        volleyCd.classList.remove('hidden');
        triggerTactileFeedback('Залп стрел выпущен!');
        let time = 8;
        volleyCd.textContent = time + 'с';
        const interval = setInterval(() => {
          time--;
          if (time <= 0) {
            clearInterval(interval);
            volleyCd.classList.add('hidden');
          } else {
            volleyCd.textContent = time + 'с';
          }
        }, 1000);
      }
    }

    function toggleGameSpeed(btn) {
      const speeds = ['1x', '2x', '3x'];
      let current = btn.getAttribute('data-speed') || '1x';
      let nextIndex = (speeds.indexOf(current) + 1) % speeds.length;
      let nextSpeed = speeds[nextIndex];
      btn.setAttribute('data-speed', nextSpeed);
      btn.querySelector('.speed-text').textContent = nextSpeed;
      triggerTactileFeedback('Скорость игры: ' + nextSpeed);
    }
  </script>
